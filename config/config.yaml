# ===================
# Project Configuration
# ===================
project:
  name: "LLM Belief Elicitation"
  random_seed: 2025

# ===================
# Active application / domain
# ===================
# Backward-compatible:
# - If you keep `attributes:` and `real_profiles:` at top-level, they will be used.
# - Otherwise, the runtime loads the app spec from `app.spec_path`.
app:
  # id: "nvidia_5090"
  # spec_path: "config/apps/Nvidia5090.yaml"
  # id: "ipadmini7"
  # spec_path: "config/apps/ipadmini7.yaml"
  # id: "iphone17e_basestorage"
  # spec_path: "config/apps/iphone17e_basestorage.yaml"
  # id: "iphone17e"
  # spec_path: "config/apps/iphone17e.yaml"
  id: "iphone17"
  spec_path: "config/apps/iphone17.yaml"
  # id: "playstation5pro"
  # spec_path: "config/apps/playstation5pro.yaml"
  # id: "applewatch"
  # spec_path: "config/apps/applewatch.yaml"
  # id: "iphone"
  # spec_path: "config/apps/iphone.yaml"

# ===================
# Path Configuration (relative to project root)
# ===================
paths:
  data_dir: "data"
  data_raw_dir: "data/raw"
  data_interim_dir: "data/interim"
  data_processed_dir: "data/processed"
  output_dir: "output"
  output_figures_dir: "output/figures"
  output_tables_dir: "output/tables"
  output_models_dir: "output/models"
  logs_dir: "logs"
  plot_dir: "plot"
  models_dir: "models"

# ===================
# OpenAI API Configuration
# ===================
openai:
  model: "gpt-5-nano"
  temperature: 1.0
  reasoning_effort: "medium"
  api_key_env_var: "OPENAI_API_KEY"
  logprobs:
    enabled: false
    model: "gpt-4.1"
    temperature: 0.0
    max_output_tokens: 16
    top_logprobs: 2
    include:
      - "message.output_text.logprobs"

# ===================
# Data Collection Settings
# ===================
collection:
  profiles_file: "profiles_shuffled.csv"
  scored_profiles_file: "scored_profiles_shuffled.csv"
  num_prompt_variants: 10
  default_n_makeup: 5000
  fixreal_sample_limit: 20000
  default_n_top: 50

# ===================
# Model Training Settings
# ===================
training:
  batch_size: 64
  learning_rate: 0.001
  epochs: 50
  early_stopping_patience: 3
  weight_decay: 0.00001
  device: "auto"  # auto, cuda, cpu, mps

# ===================
# Analysis Settings
# ===================
analysis:
  reduction_method: "fa_varimax"  # fa_varimax, pca, kernel_pca
  n_components: 2
  visualization:
    dpi: 300
    format: "png"
