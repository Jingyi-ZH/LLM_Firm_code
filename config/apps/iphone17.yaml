app:
  id: "iPhone 17"
  entity: "smartphone"

prompting:
  baseline_storage: "256 GB"
  baseline_color: "black"
  default_date: "2025-03-17"
  user_template: |
    Please consider two smartphone alternatives, both with {baseline_storage} storage capacity and {baseline_color} color:
    {l0}: {p0}
    {l1}: {p1}

    Return exactly one label: '{l0}' or '{l1}'. Output nothing else, no quotes, no punctuation, no spaces, and no line breaks.
  system_texts:
    prompt_0: "You will be provided with two smartphone alternatives described by a set of attributes. Decide which one is more likely to appear in the next iPhone generation lineup (covering standard, Pro, Max, Plus, or Air) within 6 months."
    prompt_1: "You will be shown two smartphone profiles with specific attributes. Identify which is more plausible for Apple's next iPhone lineup (standard, Pro, Max, Plus, Air) within 6 months."
    prompt_2: "Two smartphone alternatives will be presented as stimuli. Select the alternative that more closely aligns with the next-generation iPhone models (standard, Pro, Max, Plus, Air) scheduled within 6 months."
    prompt_3: "You will receive two smartphone descriptions. Choose the one more likely to appear in Apple's upcoming iPhone series within 6 months."
    prompt_4: "In this task, two sets of smartphone specifications are provided. Determine which set better corresponds to Apple's forthcoming iPhone generation (6-month horizon)."
    prompt_5: "Participants are asked to evaluate two smartphone prototypes. Identify the prototype most consistent with the characteristics of the next iPhone lineup (within 6 months)."
    prompt_6: "Two smartphone alternatives defined by multiple attributes will be shown. Decide which alternative is more realistic to be included in Apple's next iPhone lineup within 6 months."
    prompt_7: "Two smartphone configurations are introduced as experimental stimuli. Determine which configuration more plausibly belongs to the next iPhone generation (6 months)."
    prompt_8: "This task presents two smartphone concepts. Select the concept more likely to be adopted in Apple's next iPhone generation within 6 months."
    prompt_9: "Two smartphone attribute sets will be evaluated. Decide which set is more likely to be represented in the upcoming iPhone generation (within 6 months)."
  neutral_criteria: "Base your assessment on historical trajectories of iPhone development, market positioning dynamics, technical feasibility of the configurations, and considerations of plausible generational change patterns."

attributes:
  battery_life:
    name: "battery life (in hours of video playback)"
    prompt_name: "battery life"
    values: [18, 24, 30, 36, 42]
    format:
      suffix: " hours video playback"
      cast: "int"
    jitter:
      dist: "normal"
      scale: 1.0
      round: 0
      clip: [14, 58]
      p_no_jitter: 0.40
  screen_size:
    name: "screen size (in inches)"
    prompt_name: "screen size"
    values: [6.1, 6.3, 6.6, 6.9]
    format:
      suffix: " inches"
    jitter:
      enabled: false
  thickness:
    name: "thickness (in mm)"
    prompt_name: "thickness"
    values: [6, 7.7, 8.3, 8.8]
    format:
      suffix: " mm"
    jitter:
      dist: "normal"
      scale: 0.2
      round: 2
      clip: [5.4, 9.2]
      p_no_jitter: 0.40
  front_camera:
    name: "front camera resolution (in MP)"
    prompt_name: "front camera resolution"
    values: [12, 18, 24, 30]
    format:
      suffix: " MP"
      cast: "int"
    jitter:
      dist: "normal"
      scale: 1.0
      round: 0
      clip: [8, 48]
      p_no_jitter: 0.40
  rear_camera:
    name: "rear camera main lens resolution (in MP)"
    prompt_name: "rear camera main lens resolution"
    values: [36, 48, 60, 72]
    format:
      suffix: " MP"
      cast: "int"
    jitter:
      dist: "normal"
      scale: 3.0
      round: 0
      clip: [24, 90]
      p_no_jitter: 0.40
  focal_length:
    name: "rear camera longest focal length (in x)"
    prompt_name: "rear camera longest focal length"
    values: [1, 3, 5, 8, 10]
    format:
      suffix: "x"
      cast: "int"
    jitter:
      dist: "normal"
      scale: 0.2
      round: 1
      clip: [1.0, 12.0]
      p_no_jitter: 0.40
  ultrawide:
    name: "ultrawide camera"
    prompt_name: "ultrawide camera"
    values: ["equipped", "not equipped"]
    categorical: true
    encode_map:
      not equipped: 1
      equipped: 0
    jitter:
      enabled: false
  geekbench:
    name: "Geekbench multicore score"
    prompt_name: "Geekbench multicore score"
    values: [6200, 7000, 7800, 8600, 9400]
    format:
      cast: "int"
    jitter:
      dist: "normal"
      scale: 100
      round: 0
      clip: [5000, 10000]
      p_no_jitter: 0.40
  ram:
    name: "RAM"
    prompt_name: "RAM"
    values: [4, 8, 12, 16]
    format:
      suffix: " GB"
      cast: "int"
    jitter:
      enabled: false
  price:
    name: "price"
    prompt_name: "price"
    values: [749, 849, 949, 1049, 1149, 1249]
    format:
      prefix: "$"
      cast: "int"
    jitter:
      dist: "uniform"
      scale: 30
      round: 0
      clip: [649, 1399]
      p_no_jitter: 0.40

